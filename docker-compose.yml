services:
  falkordb:
    image: falkordb/falkordb:v4.10.0
    container_name: bench-falkordb
    restart: unless-stopped
    ports:
      - "6380:6379"
    cpus: "0.5"
    mem_limit: "256m"
    volumes:
      - ./docker-data/falkordb:/data

  arangodb:
    image: arangodb:3.11.9
    container_name: bench-arangodb
    restart: unless-stopped
    ports:
      - "8529:8529"
    cpus: "0.5"
    mem_limit: "256m"
    environment:
      - ARANGO_ROOT_PASSWORD=${ARANGO_PASSWORD:-benchmark_root_pw}
    volumes:
      - ./docker-data/arangodb:/var/lib/arangodb3
